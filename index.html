<style id="uzzal-telecom-pro-glass-fix">

body {

[class*="bg-white"], [class*="bg-slate-50"], [class*="bg-gray-50"] {
  background: linear-gradient(145deg, rgba(30, 41, 59, 0.52), rgba(15, 23, 42, 0.68)) !important;

  color: #f8fafc !important;
}
