<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>উজ্জ্বল গ্যাজেট জোন</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--pink:#e2136e;--pink2:#ff4f9a;--soft:rgba(255,255,255,.72);--line:rgba(255,255,255,.25)}
  *{box-sizing:border-box}
  body{margin:0;padding:10px;font-family:'Hind Siliguri',system-ui,sans-serif;color:#fff;background:#14031f;min-height:100vh;overflow-x:hidden}
  .bg{position:fixed;inset:0;z-index:-1;overflow:hidden;background:radial-gradient(circle at 20% 10%,#4a0a52,#14031f 60%)}
  .bg i{position:absolute;border-radius:50%;filter:blur(60px);opacity:.8;animation:float 18s ease-in-out infinite}
  .bg i:nth-child(1){width:46vmax;height:46vmax;background:#e2136e;left:-10vmax;top:-8vmax}
  .bg i:nth-child(2){width:38vmax;height:38vmax;background:#7b2ff7;right:-8vmax;top:20vh;animation-delay:-6s}
  .bg i:nth-child(3){width:34vmax;height:34vmax;background:#00c6ff;left:25vw;bottom:-14vmax;animation-delay:-11s}
  @keyframes float{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(8vw,6vh) scale(1.15)}66%{transform:translate(-6vw,10vh) scale(.9)}}
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  .box{max-width:1000px;margin:0 auto 14px;padding:16px;border-radius:24px;background:linear-gradient(135deg,rgba(255,255,255,.2),rgba(255,255,255,.05));border:1px solid var(--line);box-shadow:inset 0 1px 1px rgba(255,255,255,.6),0 18px 40px rgba(0,0,0,.3);backdrop-filter:blur(14px) saturate(160%);-webkit-backdrop-filter:blur(14px) saturate(160%);animation:rise .5s ease both}
  h3{margin:4px 0 12px}
  label{display:block;font-size:13px;color:var(--soft);margin:8px 0 4px}
  input,select{width:100%;padding:10px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.12);color:#fff;font:inherit;font-size:15px}
  select option{color:#222}
  input::placeholder{color:rgba(255,255,255,.5)}
  input:focus,select:focus{outline:none;border-color:#fff;background:rgba(255,255,255,.2)}
  button{border:1px solid rgba(255,255,255,.4);border-radius:14px;padding:9px 14px;margin:6px 6px 0 0;background:linear-gradient(135deg,var(--pink),var(--pink2));color:#fff;font:inherit;font-size:14px;cursor:pointer;box-shadow:0 8px 20px rgba(226,19,110,.35);transition:transform .15s}
  button:hover{transform:translateY(-2px)}
  button.light{background:rgba(255,255,255,.14);box-shadow:none;border-color:var(--line)}
  button.on{background:linear-gradient(135deg,#01babd,#00d4aa)}
  button.red{background:linear-gradient(135deg,#ff5a5a,#c81e3c)}
  button.green{background:linear-gradient(135deg,#01babd,#00d4aa)}
  .row{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:12px}
  .stat{padding:12px;border-radius:18px;background:rgba(255,255,255,.08);border:1px solid var(--line);animation:rise .5s ease both}
  .stat small{color:var(--soft)}
  .stat b{display:block;font-size:22px;margin-top:4px}
  .good{color:#7dffb3}
  .err{color:#ff8fa3}
  .sub{color:var(--soft);font-size:13px}
  .sticky{position:sticky;top:0;z-index:10;margin:-10px -10px 14px;background:rgba(20,3,31,.6);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
  .topbar{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;font-size:18px;font-weight:700}
  .menu{display:flex;flex-wrap:wrap;gap:6px;padding:8px 10px}
  .menu button{margin:0}
  .bar{height:12px;border-radius:99px;background:rgba(255,255,255,.15);overflow:hidden;margin-top:6px}
  .bar span{display:block;height:100%;background:linear-gradient(90deg,#01babd,#00d4aa);transition:width .8s}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{padding:6px 12px;border-radius:99px;background:rgba(255,255,255,.12);font-size:13px}
  .wrap{overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-size:14px;margin-top:8px}
  th{color:var(--soft);font-size:13px;text-align:left;padding:8px;border-bottom:1px solid rgba(255,255,255,.2);white-space:nowrap}
  td{padding:8px;border-bottom:1px solid rgba(255,255,255,.1);white-space:nowrap}
  tbody tr:hover{background:rgba(255,255,255,.07)}
  td select{width:auto;padding:6px}
  .profit{color:#7dffb3}
  .hidden{display:none !important}
  .mhead{text-align:center;padding:24px 10px 4px}
  .mhead h1{margin:0;font-size:28px}
  .mhead p{color:var(--soft);margin:6px 0 0}
  .shutters{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px;max-width:1000px;margin:18px auto;padding:0 10px}
  .shop{position:relative;height:260px;margin:0;padding:0;border-radius:18px;overflow:hidden;border:1px solid var(--line);background:linear-gradient(180deg,#24103a,#0d0618);color:#fff;text-align:left;box-shadow:0 18px 40px rgba(0,0,0,.4);cursor:pointer}
  .shop:hover{transform:translateY(-4px)}
  .shop .inside{position:absolute;left:18px;right:18px;bottom:18px;z-index:1}
  .shop .inside small{display:block;color:var(--soft);font-size:14px;margin-bottom:4px}
  .shop .inside em{font-style:normal;font-size:13px;color:#7dffb3}
  .shop .roll{position:absolute;left:0;right:0;top:0;bottom:0;z-index:3;background:repeating-linear-gradient(0deg,#5a5a64 0 14px,#34343c 14px 18px);transition:transform .75s cubic-bezier(.6,0,.3,1)}
  .shop.up .roll{transform:translateY(-102%)}
  .shop .sign{position:absolute;left:0;right:0;top:0;z-index:4;padding:16px;font-size:18px;font-weight:700;background:var(--c);color:#fff;box-shadow:0 4px 12px rgba(0,0,0,.35)}
  .g1{background:linear-gradient(135deg,#7b2ff7,#5b2bd6)!important}
  .g2{background:linear-gradient(135deg,#00b4c8,#06c3c7)!important}
  .g3{background:linear-gradient(135deg,#1fbf75,#0f9d58)!important}
  .g4{background:linear-gradient(135deg,#ff4f8b,#c2185b)!important}
  .simgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
  .simcard{padding:14px;border-radius:18px;background:rgba(255,255,255,.08);border:1px solid var(--line)}
  .simcard b{display:block;font-size:18px;margin:4px 0}
  .cardgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
  .cardtile{padding:12px;border-radius:18px;background:rgba(255,255,255,.08);border:1px solid var(--line)}
  .cardtile img{width:100%;border-radius:12px;display:block;margin-bottom:8px}
  .qrbox{width:180px;height:180px;border-radius:16px;background:rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;overflow:hidden}
  .qrbox img{width:100%;height:100%;object-fit:contain;background:#fff}
  body,.bg{background:#111827!important}
  .bg i{opacity:.1!important;animation:none!important;filter:blur(90px)!important}
  .opbanners{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
  .opb{padding:0;margin:0;height:78px;border-radius:16px;background:#fff!important;border:3px solid transparent;overflow:hidden;box-shadow:0 8px 20px rgba(0,0,0,.3)}
  .opb img{width:100%;height:100%;object-fit:contain;padding:6px;display:block}
  .opb.on{border-color:#01babd}
  .simicon{height:120px;border-radius:12px;background:linear-gradient(135deg,#7b2ff7,#01babd);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:22px;margin-bottom:8px}
  .warn{color:#ffd166}
  .chip button{padding:2px 8px;margin:0 0 0 6px;font-size:12px}
  .chip{display:inline-flex;align-items:center}
  .catrow{display:flex;gap:6px;overflow-x:auto;flex:1;min-width:0;align-items:center;padding-bottom:2px}
  .catrow button{white-space:nowrap;margin:0}
  .catpanel{padding:8px 10px;background:rgba(20,3,31,.75);border-top:1px solid var(--line)}
</style>
</head>
<body>
<div class="bg"><i></i><i></i><i></i></div>

<div id="loginBox" class="box" style="max-width:380px">
  <h3>লগ ইন করুন</h3>
  <input id="email" type="email" placeholder="ইমেইল">
  <input id="password" type="password" placeholder="পাসওয়ার্ড" style="margin-top:8px">
  <button id="loginBtn">লগ ইন</button>
  <p id="loginMsg" class="err"></p>
</div>

<div id="market" class="hidden">
  <div class="mhead"><h1>উজ্জ্বল মার্কেট</h1><p>শাটারে ক্লিক করে দোকানে ঢুকুন</p></div>
  <div class="shutters" id="shutters"></div>
</div>

<div id="appBox" class="hidden">
  <div class="sticky">
    <div class="menu" id="shopBtns"></div>
    <div id="catPanel"></div>
    <div class="menu" id="sectorBtns" style="background:rgba(255,255,255,.05)"></div>
  </div>
  <div id="view"></div>
</div>

<script type="module">
  import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

  const sb = createClient("https://fvxapnnbkhtvgwzthrsf.supabase.co", "sb_publishable_oj6orwGEGlo5bwHB4whaSg_xo6FzsaT");

  // DUMMY: দোকান ও সেক্টরের ভাগ অস্থায়ী। পরে ঠিক করা হবে।
  const SHOPS = [
    { key: "telecom",  name: "বিকাশ এজেন্টের হিসাব",      sectors: ["bkash", "nagad", "flexi", "sim", "card"] },
    { key: "gadget",   name: "মোবাইল সার্ভিসিং", sectors: ["service", "parts", "accessory", "mobile", "gadget"] },
    { key: "personal", name: "বিকাশ পার্সোনালের হিসাব",           sectors: ["bkash_personal"] }
  ];
  // [নাম, স্টক আছে কিনা]
  const SECTOR_INFO = {
    service: ["মোবাইল সার্ভিসিং", false], bkash: ["বিকাশ (উজ্জ্বল টেলিকম)", false], nagad: ["নগদ এজেন্ট", false], parts: ["স্পেয়ার পার্টস", false],
    bkash_personal: ["বিকাশ (পার্সোনাল)", false], flexi: ["ফ্লেক্সি লোড", false],
    sim: ["সিম", true], card: ["মিনিট / এমবি কার্ড", true], accessory: ["মোবাইল অ্যাক্সেসরিজ", true],
    mobile: ["মোবাইল", true], gadget: ["গ্যাজেট", true]
  };
  const STATUSES = ["রিসিভ করা", "পরীক্ষা চলছে", "পার্টসের অপেক্ষায়", "সার্ভিসিং চলছে", "ডেলিভারির জন্য প্রস্তুত", "ডেলিভারি সম্পন্ন", "বাতিল"];
  const KIND_NAME = { send: "সেন্ড মানি", cashout: "ক্যাশ আউট", cashin: "ক্যাশ ইন" };

  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const bn = n => Math.round(Number(n) || 0).toLocaleString("bn-BD");
  const today = () => new Date().toLocaleDateString("en-CA");
  const secName = k => SECTOR_INFO[k][0];
  const isStock = k => SECTOR_INFO[k][1];
  const shopOf = k => SHOPS.find(s => s.sectors.includes(k));
  const isBk = k => ["bkash", "nagad", "bkash_personal"].includes(k);
  const scopeOf = k => k === "bkash_personal" ? "personal" : k === "nagad" ? "nagad" : "bkash";
  const dueOf = j => Math.max(0, Number(j.estimate) - Number(j.discount || 0) - Number(j.advance || 0));
  const sumOf = (arr, f) => arr.reduce((s, x) => s + (Number(f(x)) || 0), 0);
  const stat = (l, v, c = "") => `<div class="stat"><small>${l}</small><b class="${c}">${v}</b></div>`;

  let cur = "bkash";
  let curCardOp = "GP";
  let assets = {};
  let gDate = today();
  let S = {}, bk = [], jobs = [], products = [], entries = [], sims = [];

  // ---------- লগ ইন ----------
  $("loginBtn").onclick = async () => {
    $("loginMsg").textContent = "";
    const { error } = await sb.auth.signInWithPassword({ email: $("email").value.trim(), password: $("password").value });
    if (error) $("loginMsg").textContent = "ইমেইল বা পাসওয়ার্ড ভুল হয়েছে";
    else showApp();
  };
  function showLogin() { $("appBox").classList.add("hidden"); $("market").classList.add("hidden"); $("loginBox").classList.remove("hidden"); }
  function showApp() { $("loginBox").classList.add("hidden"); buildMarket(); showMarket(); loadAll(); }

  // ---------- মার্কেট ও শাটার ----------
  const MARKET = [
    { key: "telecom", icon: "📱", cat: "টেলিকম ও বিকাশ সেন্টার", color: "#e2136e" },
    { key: "gadget", icon: "🔧", cat: "ইলেকট্রনিক্স ও সার্ভিসিং", color: "#7b2ff7" },
    { key: "personal", icon: "💳", cat: "পার্সোনাল ব্যাংকিং", color: "#01babd" }
  ];
  function buildMarket() {
    $("shutters").innerHTML = MARKET.map(m => {
      const s = SHOPS.find(x => x.key === m.key);
      return `<button class="shop" data-act="openShutter" data-v="${m.key}" style="--c:${m.color}">
        <span class="roll"></span>
        <span class="sign">${m.icon} ${s.name}</span>
        <span class="inside"><small>${m.cat}</small><em>${s.sectors.length}টি সেক্টর</em></span>
      </button>`;
    }).join("");
  }
  function showMarket() {
    $("appBox").classList.add("hidden");
    $("market").classList.remove("hidden");
    window.scrollTo(0, 0);
  }
  function openShop() {
    $("market").classList.add("hidden");
    $("appBox").classList.remove("hidden");
    window.scrollTo(0, 0);
    render();
  }

  // ---------- ডাটা ----------
  async function loadAll() {
    const [st, tx, jb, pr, en] = await Promise.all([
      sb.from("settings").select("*"),
      sb.from("bkash_tx").select("*").order("tx_date"),
      sb.from("jobs").select("*").order("created_at"),
      sb.from("products").select("*").order("name"),
      sb.from("entries").select("*").eq("entry_date", gDate).order("created_at")
    ]);
    const bad = [st, tx, jb, pr, en].find(r => r.error);
    if (bad) return alert("ডাটা আনা যায়নি: " + bad.error.message);
    S = {};
    st.data.forEach(r => S[r.key] = Number(r.value));
    const sm = await sb.from("sims").select("*").order("number");
    if (sm.error) return alert("সিম ডাটা আনা যায়নি: " + sm.error.message);
    sims = sm.data;
    const as = await sb.from("assets").select("*");
    if (as.error) return alert("ছবি আনা যায়নি: " + as.error.message);
    assets = {};
    as.data.forEach(r => assets[r.key] = r.data);
    bk = tx.data; jobs = jb.data; products = pr.data; entries = en.data;
    render();
  }

  // ---------- মেনু ও ভিউ ----------
  function render() {
    buildMenus();
    const v = $("view");
    if (cur === "bkash_personal") personalView(v);
    else if (isBk(cur)) bkView(v);
    else if (cur === "service") serviceView(v);
    else if (cur === "parts") partsView(v);
    else if (cur === "flexi" || cur === "card" || cur === "sim") opView(v);
    else if (cur === "accessory") accView(v);
    else genView(v);
  }

  function buildMenus() {
    const shop = shopOf(cur);
    $("shopBtns").innerHTML =
      `<button data-act="market" class="light">← মার্কেট</button>` +
      SHOPS.map(s => `<button data-act="shop" data-v="${s.key}" class="${s.key === shop.key ? "on" : "light"}">${s.name}</button>`).join("") +
      `<div class="catrow">${CAT_TREE.map(t => `<button data-act="catTop" data-v="${esc(t.name)}" class="${openTop === t.name ? "on" : "light"}">${esc(t.name)} ▾</button>`).join("")}</div>`;
    const top = CAT_TREE.find(t => t.name === openTop);
    $("catPanel").innerHTML = top ? `<div class="menu catpanel">
        <button data-act="cat" data-v="${esc(top.name)}" class="light">সব ${esc(top.name)}</button>
        ${top.subs.map(x => `<button data-act="cat" data-v="${esc(top.name + " › " + x)}" class="${curCat === top.name + " › " + x ? "on" : "light"}">${esc(x)}</button>`).join("")}
      </div>` : "";
    $("sectorBtns").innerHTML = shop.sectors.map(k => `<button data-act="sector" data-v="${k}" class="${k === cur ? "on" : "light"}">${secName(k)}</button>`).join("") +
      `<button data-act="logout" class="red" style="margin-left:auto">লগ আউট</button>`;
  }

  // ---------- বিকাশ ড্যাশবোর্ড ----------
  function bkStats(scope) {
    const list = bk.filter(x => x.scope === scope), t = today(), ym = t.slice(0, 7);
    const inSum = sumOf(list.filter(x => x.kind === "cashin"), x => x.amount);
    const outSum = sumOf(list.filter(x => x.kind !== "cashin"), x => x.amount);
    const todayL = list.filter(x => x.tx_date === t);
    return {
      balance: (S["open_" + scope] || 0) + inSum - outSum,
      month: sumOf(list.filter(x => x.kind !== "cashin" && x.tx_date.startsWith(ym)), x => x.amount),
      send: sumOf(todayL.filter(x => x.kind === "send"), x => x.amount),
      cash: sumOf(todayL.filter(x => x.kind === "cashout"), x => x.amount),
      comm: sumOf(todayL, x => x.charge),
      todayL,
      limit: S["limit_" + scope] || 300000
    };
  }

  function bkView(v) {
    const sc = scopeOf(cur), s = bkStats(sc), pct = Math.min(100, Math.round(s.month / s.limit * 100) || 0);
    v.innerHTML = `
    <div class="box"><h3>${AGENT_LOGO[cur] ? `<img src="${AGENT_LOGO[cur]}" style="height:28px;vertical-align:middle;margin-right:8px">` : ""}${secName(cur)}</h3>
      <div class="grid">
        ${stat("ব্যালেন্স", bn(s.balance) + " ৳")}
        ${stat("আজকের সেন্ড মানি", bn(s.send) + " ৳")}
        ${stat("আজকের ক্যাশ আউট", bn(s.cash) + " ৳")}
        ${stat("আজকের চার্জ / কমিশন", bn(s.comm) + " ৳", "good")}
      </div>
      <div>মাসিক ব্যবহার: <b>${bn(s.month)} ৳</b> / ${bn(s.limit)} ৳ (${bn(pct)}%)</div>
      <div class="bar"><span style="width:${pct}%"></span></div>
    </div>
    <div class="box"><h3>নতুন লেনদেন</h3>
      <div class="row">
        <div><label>ধরন</label><select id="tKind">${Object.entries(KIND_NAME).map(([k, n]) => `<option value="${k}">${n}</option>`).join("")}</select></div>
        <div><label>পরিমাণ (৳)</label><input id="tAmt" type="number"></div>
        <div><label>চার্জ / কমিশন (৳)</label><input id="tChg" type="number"></div>
        <div><label>মন্তব্য</label><input id="tNote" placeholder="নাম / নম্বর"></div>
        <div><label>তারিখ</label><input id="tDate" type="date" value="${today()}"></div>
      </div>
      <button data-act="bkSave" data-v="${sc}">লেনদেন সেভ করুন</button>
    </div>
    ${qrBox(sc)}
    <div class="box"><h3>ব্যালেন্স ও লিমিট সেট করুন</h3>
      <div class="row">
        <div><label>এখন ব্যালেন্সে যত টাকা আছে</label><input id="balSet" type="number"></div>
        <div><label>মাসিক লিমিট (৳)</label><input id="limSet" type="number" value="${s.limit}"></div>
      </div>
      <button data-act="bkBal" data-v="${sc}">ব্যালেন্স সেভ করুন</button>
      <button data-act="bkLim" data-v="${sc}" class="light">লিমিট সেভ করুন</button>
    </div>

  const BAL_GREEN = 50000, BAL_YELLOW = 30000;
  function balClass(b) { return b >= BAL_GREEN ? "good" : b >= BAL_YELLOW ? "warn" : "err"; }

  // ---------- পার্সোনাল বিকাশ: সিম ভিত্তিক হিসাব ----------
  function simRows() {
    const t = today(), ym = t.slice(0, 7);
    return sims.map(sm => {
      const L = bk.filter(x => x.scope === "personal" && x.sim === sm.number);
      const inS = sumOf(L.filter(x => x.kind === "cashin"), x => x.amount);
      const outS = sumOf(L.filter(x => x.kind !== "cashin"), x => x.amount);
      return {
        sm,
        bal: Number(sm.opening) + inS - outS,
        lim: Number(sm.monthly_limit),
        send: sumOf(L.filter(x => x.tx_date === t && x.kind === "send"), x => x.amount),
        recv: sumOf(L.filter(x => x.tx_date === t && x.kind === "cashin"), x => x.amount),
        month: sumOf(L.filter(x => x.kind !== "cashin" && x.tx_date.startsWith(ym)), x => x.amount)
      };
    });
  }

  function personalView(v) {
    const rows = simRows(), t = today();
    const todayL = bk.filter(x => x.scope === "personal" && x.tx_date === t);
    const totLimit = sumOf(rows, r => r.lim), totMonth = sumOf(rows, r => r.month);
    const pct = totLimit ? Math.min(100, Math.round(totMonth / totLimit * 100)) : 0;
    const card = (l, val, cls) => `<div class="stat ${cls}"><small>${l}</small><b>${val}</b></div>`;
    const kindOpts = [["send", "সেন্ড মানি"], ["cashout", "ক্যাশ আউট"], ["cashin", "ক্যাশ ইন (রিসিভ)"]]
      .map(([k, n]) => `<option value="${k}">${n}</option>`).join("");
    const simOpts = sims.map(s => `<option value="${esc(s.number)}">${esc(s.number)}</option>`).join("");
    v.innerHTML = `
    <div class="box" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">
      <div><h3 style="margin:0"><img src="${PERSONAL_LOGO}" style="height:32px;vertical-align:middle;margin-right:8px">Bkash Personal</h3><small class="sub">পার্সোনাল সিম হিসাব</small></div>

    <div class="grid">

      ${card("আজ সেন্ড মানি", bn(sumOf(rows, r => r.send)) + " ৳", "g2")}
      ${card("আজ রিসিভ মানি", bn(sumOf(rows, r => r.recv)) + " ৳", "g3")}

    </div>
    <div class="box"><h3>নতুন সিম নম্বর যোগ করুন</h3>
      <div class="row">
        <div><label>সিম নম্বর</label><input id="simNum" placeholder="01XXXXXXXXX"></div>

        <div><label>শুরুর ব্যালেন্স (৳)</label><input id="simOpen" type="number"></div>

      <button data-act="simAdd">সিম যোগ করুন</button>
    </div>
    <div class="box"><h3>নতুন লেনদেন</h3>

        <div><label>ট্রানজেকশন আইডি</label><input id="pTrx"></div>

    <div class="box"><h3>সিম তালিকা (আজকের হিসাব)</h3><div class="wrap"><table>
      <thead><tr><th>মোবাইল নম্বর</th><th>সেন্ড মানি</th><th>রিসিভ মানি</th><th>ব্যালেন্স</th><th>মাসিক বরাদ্দ</th><th>মাসে ব্যবহৃত</th><th>মাসে বাকি</th><th></th></tr></thead>
      <tbody>${rows.map(r => `<tr><td>${esc(r.sm.number)}</td><td>${bn(r.send)}</td><td>${bn(r.recv)}</td><td class="${balClass(r.bal)}">${bn(r.bal)}</td><td>${bn(r.lim)}</td><td>${bn(r.month)}</td><td class="good">${bn(r.lim - r.month)}</td><td><button class="red" data-act="simDel" data-id="${r.sm.id}">মুছুন</button></td></tr>`).join("") || `<tr><td colspan="8">কোনো সিম নেই</td></tr>`}</tbody>
    </table></div></div>
    <div class="box"><h3>আজকের লেনদেন</h3><div class="wrap"><table>
      <thead><tr><th>সিম</th><th>ধরন</th><th>টাকা</th><th>বিবরণ</th><th></th></tr></thead>
      <tbody>${todayL.map(x => `<tr><td>${esc(x.sim)}</td><td>${KIND_NAME[x.kind]}</td><td>${bn(x.amount)}</td><td>${esc(x.note)}</td><td><button class="red" data-act="bkDel" data-id="${x.id}">মুছুন</button></td></tr>`).join("") || `<tr><td colspan="5">আজ কোনো লেনদেন নেই</td></tr>`}</tbody>
    </table></div></div>`;

  const CARD_LABEL = { mb: "এমবি কার্ড", mb2: "৫০০ এমবি কার্ড", min: "মিনিট কার্ড" };

  const OP_NAME = { GP: "গ্রামীণফোন", Robi: "রবি", Airtel: "Airtel", BL: "Banglalink" };
  const FLEXI_AMTS = [20, 30, 40, 50, 60, 70, 80, 90, 100];

  function tileLabel(t) { return curCardOp === "BL" ? BL_LABEL[t] : CARD_LABEL[t]; }
  function cardItems() {
    return Object.keys(CARD_IMG[curCardOp]).map(t => ({ label: tileLabel(t), img: CARD_IMG[curCardOp][t] }));
  }
  function opBanners() {
    return `<div class="opbanners">${Object.keys(CARD_IMG).map(o =>
      `<button class="opb ${o === curCardOp ? "on" : ""}" data-act="cardOp" data-v="${o}"><img src="${OP_LOGO[o]}" alt="${OP_NAME[o]}"></button>`).join("")}</div>`;
  }
  function tilesHtml(sector, items) {
    const plist = products.filter(p => p.sector === sector);
    return `<div class="cardgrid">${items.map(it => {
      const name = curCardOp + " | " + it.label, p = plist.find(x => x.name === name);
      return `<div class="cardtile">
        ${it.img ? `<img src="${it.img}" alt="${esc(it.label)}">` : `<div class="simicon">SIM</div>`}
        <b>${esc(it.label)}</b>
        <div class="sub">স্টক: <span class="good">${bn(p ? p.qty : 0)}</span> · বিক্রয়: ${bn(p ? p.sell_price : 0)} ৳</div>
        ${p ? `<button data-act="cardSell" data-id="${p.id}">বিক্রি</button><button class="green" data-act="prodIn" data-id="${p.id}">+ স্টক</button>`
            : `<button class="green" data-act="cardAdd" data-v="${esc(name)}" data-sec="${sector}">স্টক খুলুন</button>`}
      </div>`;
    }).join("")}</div>`;
  }
  function flexiPanel() {
    const bal = S["flexi_" + curCardOp] || 0;
    const soldL = entries.filter(x => x.sector === "flexi" && String(x.item_name).startsWith(OP_NAME[curCardOp]));
    return `<div class="box"><h3>${OP_NAME[curCardOp]} ফ্লেক্সি লোড</h3>
      <div class="stat g1"><small>ফ্লেক্সি ব্যালেন্স</small><b>${bn(bal)} ৳</b></div>
      <button class="light" data-act="flexiBal" data-v="${curCardOp}">ব্যালেন্স সেট করুন</button>
      <div class="row" style="margin-top:12px">
        <div><label>মোবাইল নম্বর</label><input id="fNum" placeholder="01XXXXXXXXX"></div>
        <div><label>টাকা (৳)</label><input id="fAmt" type="number"></div>
        <div><label>কমিশন (৳)</label><input id="fCom" type="number" value="0"></div>
      </div>
      <div class="chips" style="margin:10px 0">${FLEXI_AMTS.map(a => `<button class="light" data-act="flexiPick" data-v="${a}">${a}</button>`).join("")}</div>
      <button data-act="flexiSell" data-v="${curCardOp}">বিক্রি সেভ করুন</button>
      <div class="wrap"><table>
        <thead><tr><th>বিবরণ</th><th>টাকা</th><th>কমিশন</th><th></th></tr></thead>
        <tbody>${soldL.map(x => `<tr><td>${esc(x.item_name)}</td><td>${bn(x.sell_total)}</td><td class="profit">${bn(x.sell_total - x.buy_total)}</td><td><button class="red" data-act="genDel" data-id="${x.id}">মুছুন</button></td></tr>`).join("") || `<tr><td colspan="4">আজ কোনো বিক্রি নেই</td></tr>`}</tbody>
      </table></div>
    </div>`;
  }
  function opView(v) {
    const ops = Object.keys(CARD_IMG);
    if (!ops.includes(curCardOp)) curCardOp = ops[0];
    let body;
    if (cur === "flexi") {
      body = flexiPanel() + `<div class="box"><h3>${OP_NAME[curCardOp]} কার্ড</h3>${tilesHtml("card", cardItems())}</div>`;
    } else if (cur === "card") {
      const soldC = entries.filter(x => x.sector === "card");
      body = `<div class="box"><h3>${OP_NAME[curCardOp]} — মিনিট / এমবি কার্ড</h3>${tilesHtml("card", cardItems())}
        <div class="sub" style="margin-top:8px">আজকের কার্ড বিক্রি: <b>${bn(soldC.length)}</b> টি · মোট ${bn(sumOf(soldC, x => x.sell_total))} ৳</div></div>`;
    } else {
      body = `<div class="box"><h3>${OP_NAME[curCardOp]} — সিম</h3>${tilesHtml("sim", [{ label: "সিম", img: "" }])}</div>`;
    }
    v.innerHTML = `<div class="box">${opBanners()}</div>` + body;
  }

  // ---------- এজেন্ট কিউআর ----------
  function qrBox(sc) {
    const qr = assets["qr_" + sc];
    return `<div class="box"><h3>কিউআর কোড</h3>
      <div class="row">
        <div class="qrbox">${qr ? `<img src="${qr}" alt="QR">` : `<div class="sub">এখনো কোনো কিউআর নেই</div>`}</div>
        <div><label>নতুন কিউআর ছবি আপলোড করুন</label><input type="file" accept="image/*" data-act="qrPick" data-v="${sc}"></div>
      </div></div>`;
  }
  function shrink(file, max) {
    return new Promise((res, rej) => {
      const img = new Image(), url = URL.createObjectURL(file);
      img.onload = () => {
        const k = Math.min(1, max / Math.max(img.width, img.height));
        const cv = document.createElement("canvas");
        cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k);
        const x = cv.getContext("2d"); x.fillStyle = "#fff"; x.fillRect(0, 0, cv.width, cv.height);
        x.drawImage(img, 0, 0, cv.width, cv.height);
        URL.revokeObjectURL(url); res(cv.toDataURL("image/jpeg", 0.9));
      };
      img.onerror = () => rej(new Error("ছবিটি পড়া যায়নি"));
      img.src = url;
    });
  }

      const { error } = await sb.from("bkash_tx").insert({
        tx_date: $("tDate").value || today(), scope: el.dataset.v, kind: $("tKind").value,
        amount: amt, charge: Number($("tChg").value) || 0, note: $("tNote").value.trim() || null

      if (!confirm("লেনদেনটি মুছবেন?")) return;

      if (error) return alert(error.message);
      loadAll();

    async bkBal(el) {
      if ($("balSet").value === "") return alert("ব্যালেন্সের পরিমাণ লিখুন");
      const sc = el.dataset.v, target = Number($("balSet").value), list = bk.filter(x => x.scope === sc);
      const effect = sumOf(list.filter(x => x.kind === "cashin"), x => x.amount) - sumOf(list.filter(x => x.kind !== "cashin"), x => x.amount);
      const { error } = await sb.from("settings").upsert({ key: "open_" + sc, value: target - effect });
      if (error) return alert(error.message);
      loadAll();
    },
    async bkLim(el) {
      const { error } = await sb.from("settings").upsert({ key: "limit_" + el.dataset.v, value: Number($("limSet").value) || 300000 });
      if (error) return alert(error.message);
      loadAll();
    },

    dField(el) { jobDraft[el.dataset.k] = el.value; updateSums(); },
    partCharge(el) { jobDraft.parts[Number(el.dataset.i)].charge = Number(el.value) || 0; updateSums(); },
    probToggle(el) {
      const c = el.dataset.v;
      jobDraft.problems = jobDraft.problems.includes(c) ? jobDraft.problems.filter(x => x !== c) : [...jobDraft.problems, c];
      render();
    },
    probAdd() {
      const val = $("probNew").value.trim();
      if (val && !jobDraft.problems.includes(val)) jobDraft.problems.push(val);
      render();
    },
    probRemove(el) { jobDraft.problems = jobDraft.problems.filter(x => x !== el.dataset.v); render(); },
    partAdd() {
      const p = products.find(x => String(x.id) === $("partSel").value);
      if (!p) return alert("স্টকে পার্টস নেই। আগে পার্টস যোগ করুন");
      const used = jobDraft.parts.filter(x => String(x.id) === String(p.id)).length;
      if (used >= p.qty) return alert("এই পার্টস স্টকে আর নেই");
      jobDraft.parts.push({ id: p.id, name: p.name, cost: Number(p.buy_price) || 0, charge: Number(p.sell_price) || 0 });
      render();
    },
    partRemove(el) { jobDraft.parts.splice(Number(el.dataset.i), 1); render(); },
    jobCancel() { jobDraft = blankJob(); render(); },
    jobEdit(el) {
      const j = jobs.find(x => String(x.id) === el.dataset.id);
      if (!j) return;
      jobDraft = { id: j.id, name: j.customer || "", phone: j.phone || "", model: j.model || "", status: j.status,
        labour: j.labour || "", advance: j.advance || "", problems: j.problem ? j.problem.split(", ") : [], parts: partsOf(j) };
      render();
      window.scrollTo(0, 0);
    },
    async partNew() {
      const name = $("pName").value.trim();
      if (!name) return alert("পার্টসের নাম লিখুন");
      const { error } = await sb.from("products").insert({ sector: "parts", category: $("pCat").value, name,
        qty: Number($("pQty").value) || 0, buy_price: Number($("pBuy").value) || 0, sell_price: Number($("pSell").value) || 0 });
      if (error) return alert(error.message);
      loadAll();
    },
    async jobSave() {
      const d = jobDraft;
      if (!d.name.trim()) return alert("কাস্টমারের নাম লিখুন");
      const old = d.id ? jobs.find(j => String(j.id) === String(d.id)) : null;
      const oldParts = old ? partsOf(old) : [];
      const need = {};
      d.parts.forEach(x => need[x.id] = (need[x.id] || 0) + 1);
      for (const id of Object.keys(need)) {
        const p = products.find(x => String(x.id) === String(id));
        const avail = (p ? p.qty : 0) + oldParts.filter(x => String(x.id) === String(id)).length;
        if (!p || avail < need[id]) return alert((p ? p.name : "একটি পার্টস") + " স্টকে পর্যাপ্ত নেই");
      }
      const partsCharge = sumOf(d.parts, x => x.charge), partsCost = sumOf(d.parts, x => x.cost);
      const labour = Number(d.labour) || 0, advance = Number(d.advance) || 0;
      const estimate = partsCharge + labour;
      const row = { customer: d.name.trim(), phone: d.phone.trim(), model: d.model.trim(), problem: d.problems.join(", "),
        status: d.status, estimate, advance: Math.min(advance, estimate), labour, parts: JSON.stringify(d.parts), parts_cost: partsCost };
      let res;
      if (old) res = await sb.from("jobs").update(row).eq("id", old.id);
      else res = await sb.from("jobs").insert({ ...row, job_date: today(), job_no: jobNo() });
      if (res.error) return alert("সেভ হয়নি: " + res.error.message);
      const delta = {};
      oldParts.forEach(x => delta[x.id] = (delta[x.id] || 0) + 1);
      d.parts.forEach(x => delta[x.id] = (delta[x.id] || 0) - 1);
      await restockMap(delta);
      jobDraft = blankJob();
      loadAll();
    },
    async jobStatus(el) {
      const { error } = await sb.from("jobs").update({ status: el.value }).eq("id", el.dataset.id);
      if (error) return alert(error.message);
      loadAll();
    },
    async jobDeliver(el) {
      const j = jobs.find(x => String(x.id) === el.dataset.id);
      if (!j) return;
      const d = prompt("ছাড় (৳)", "0");
      if (d === null) return;
      const disc = Math.max(0, Number(d) || 0);
      const net = Math.max(0, Number(j.estimate) - disc);
      const rem = Math.max(0, net - Number(j.advance));
      const r = prompt("এখন কত টাকা নিলেন?", String(rem));
      if (r === null) return;
      const adv = Math.min(net, Number(j.advance) + Math.max(0, Number(r) || 0));
      const { error } = await sb.from("jobs").update({ discount: disc, advance: adv, status: "ডেলিভারি সম্পন্ন", delivered_date: today() }).eq("id", j.id);
      if (error) return alert(error.message);
      loadAll();
    },
    async jobCollect(el) {
      const j = jobs.find(x => String(x.id) === el.dataset.id);
      if (!j) return;
      const amt = Math.max(0, Number(prompt("কত টাকা জমা নিলেন?")) || 0);
      if (!amt) return;
      const adv = Math.min(Math.max(0, Number(j.estimate) - Number(j.discount || 0)), Number(j.advance) + amt);
      const { error } = await sb.from("jobs").update({ advance: adv }).eq("id", j.id);
      if (error) return alert(error.message);
      loadAll();
    },
    async jobDel(el) {
      const j = jobs.find(x => String(x.id) === el.dataset.id);
      if (!j || !confirm("এই জবটি মুছবেন? পার্টস স্টকে ফিরে যাবে।")) return;
      const back = {};
      partsOf(j).forEach(x => back[x.id] = (back[x.id] || 0) + 1);
      await restockMap(back);
      const { error } = await sb.from("jobs").delete().eq("id", j.id);
      if (error) return alert(error.message);
      loadAll();
    },

    async pSave() {
      const amt = Number($("pAmt").value);
      if (!(amt > 0)) return alert("টাকার পরিমাণ লিখুন");
      if (!$("pSim").value) return alert("আগে একটি সিম যোগ করুন");
      const note = [$("pOther").value, $("pName").value, $("pTrx").value, $("pNote").value].map(s => s.trim()).filter(Boolean).join(" | ");
      const { error } = await sb.from("bkash_tx").insert({
        tx_date: $("pDate").value || today(), scope: "personal", kind: $("pKind").value,
        amount: amt, charge: 0, sim: $("pSim").value, note: note || null
      });
      if (error) return alert("সেভ হয়নি: " + error.message);
      loadAll();
    },
    async simAdd() {
      const num = $("simNum").value.trim();
      if (!num) return alert("সিম নম্বর লিখুন");
      const { error } = await sb.from("sims").insert({
        number: num, operator: $("simOp").value, kind: $("simKind").value,
        opening: Number($("simOpen").value) || 0, monthly_limit: Number($("simLim").value) || 300000
      });
      if (error) return alert("সিম যোগ হয়নি: " + error.message);
      loadAll();
    },
    async simDel(el) {
      if (!confirm("সিমটি তালিকা থেকে মুছবেন? আগের লেনদেন থেকে যাবে।")) return;
      const { error } = await sb.from("sims").delete().eq("id", el.dataset.id);
      if (error) return alert(error.message);
      loadAll();
    },
    cardOp(el) { curCardOp = el.dataset.v; render(); },
    async cardAdd(el) {
      const name = el.dataset.v, sec = el.dataset.sec || "card";
      const qty = Math.max(0, Number(prompt(name + " — স্টক কত?", "0")) || 0);
      const buy = Math.max(0, Number(prompt("ক্রয়মূল্য (৳)", "0")) || 0);
      const sell = Math.max(0, Number(prompt("বিক্রয়মূল্য (৳)", "0")) || 0);
      const { error } = await sb.from("products").insert({ sector: sec, name, qty, buy_price: buy, sell_price: sell });
      if (error) return alert(error.message);
      loadAll();
    },
    async cardSell(el) {
      const p = products.find(x => String(x.id) === el.dataset.id);
      if (!p || p.qty < 1) return alert("স্টকে নেই");
      const { error } = await sb.from("entries").insert({ entry_date: today(), sector: p.sector, product_id: p.id, item_name: p.name, qty: 1, sell_total: Number(p.sell_price), buy_total: Number(p.buy_price), note: null });
      if (error) return alert("সেভ হয়নি: " + error.message);
      const { error: e2 } = await sb.from("products").update({ qty: p.qty - 1 }).eq("id", p.id);
      if (e2) alert(e2.message);
      loadAll();
    },
    flexiPick(el) { $("fAmt").value = el.dataset.v; },
    async flexiSell(el) {
      const op = el.dataset.v, num = $("fNum").value.trim(), amt = Number($("fAmt").value);
      const com = Math.max(0, Number($("fCom").value) || 0);
      if (!num) return alert("মোবাইল নম্বর লিখুন");
      if (!(amt > 0)) return alert("টাকার পরিমাণ লিখুন");
      const bal = S["flexi_" + op] || 0;
      if (amt > bal) return alert("ফ্লেক্সি ব্যালেন্সে পর্যাপ্ত টাকা নেই। আছে: " + bn(bal) + " ৳");
      const { error } = await sb.from("entries").insert({ entry_date: today(), sector: "flexi", product_id: null, item_name: OP_NAME[op] + " ফ্লেক্সি " + num, qty: 1, sell_total: amt, buy_total: amt - com, note: null });
      if (error) return alert("সেভ হয়নি: " + error.message);
      const { error: e2 } = await sb.from("settings").upsert({ key: "flexi_" + op, value: bal - amt });
      if (e2) alert(e2.message);
      loadAll();
    },
    async flexiBal(el) {
      const op = el.dataset.v;
      const val = prompt(OP_NAME[op] + " ফ্লেক্সি এখন কত টাকা আছে?", String(S["flexi_" + op] || 0));
      if (val === null) return;
      const { error } = await sb.from("settings").upsert({ key: "flexi_" + op, value: Number(val) || 0 });
      if (error) return alert(error.message);
      loadAll();
    },
    async qrPick(el) {
      const f = el.files[0];
      if (!f) return;
      const data = await shrink(f, 600);
      const { error } = await sb.from("assets").upsert({ key: "qr_" + el.dataset.v, data });
      if (error) return alert("কিউআর সেভ হয়নি: " + error.message);
      loadAll();
    },
    cat(el) {
      const value = el.dataset.v;
      const topName = value.split(" › ")[0];
      const group = CAT_TREE.find(t => t.name === topName);
      if (!group) return;
      cur = group.sector;
      curCat = value;
      openTop = topName;
      render();
    },
    catTop(el) {
      const next = openTop === el.dataset.v ? null : el.dataset.v;
      openTop = next;
      if (next) {
        const group = CAT_TREE.find(t => t.name === next);
        if (group) { cur = group.sector; curCat = next; }
      }
      render();
    },
    async accAdd() {
      const name = $("aName").value.trim();
      if (!name) return alert("পণ্যের নাম লিখুন");
      const cat = $("aNewCat").value.trim() || $("aCat").value;
      const { error } = await sb.from("products").insert({ sector: "accessory", category: cat, name,
        qty: Number($("aQty").value) || 0, buy_price: Number($("aBuy").value) || 0, sell_price: Number($("aSell").value) || 0 });
      if (error) return alert(error.message);
      curCat = cat;
      loadAll();
    },
    async logout() { await sb.auth.signOut(); showLogin(); },
    setGDate(el) { gDate = el.value || today(); loadAll(); },
    genPick(el) {
      const p = products.find(x => String(x.id) === el.value);
      if (!p) return;
      const q = Number($("gQty").value) || 1;
      $("gName").value = p.name;
      $("gSell").value = Number(p.sell_price) * q;
      $("gBuy").value = Number(p.buy_price) * q;
    },
    async genSave() {
      const name = $("gName").value.trim();
      if (!name) return alert("বিবরণ লিখুন");
      const qty = Number($("gQty").value) || 1, pid = $("gProd") ? $("gProd").value : "";
      const p = pid ? products.find(x => String(x.id) === pid) : null;
      if (p && p.qty < qty) return alert("স্টকে পর্যাপ্ত নেই। আছে: " + p.qty);
      const { error } = await sb.from("entries").insert({
        entry_date: gDate, sector: cur, product_id: p ? p.id : null, item_name: name, qty,
        sell_total: Number($("gSell").value) || 0, buy_total: Number($("gBuy").value) || 0,
        note: $("gNote").value.trim() || null
      });
      if (error) return alert("সেভ হয়নি: " + error.message);
      if (p) {
        const { error: e2 } = await sb.from("products").update({ qty: p.qty - qty }).eq("id", p.id);
        if (e2) alert("স্টক আপডেট হয়নি: " + e2.message);
      }
      loadAll();
    },
    async genDel(el) {
      const e = entries.find(x => String(x.id) === el.dataset.id);
      if (!e || !confirm("এন্ট্রিটি মুছবেন?")) return;
      if (e.product_id) {
        const p = products.find(x => String(x.id) === String(e.product_id));
        if (p) await sb.from("products").update({ qty: p.qty + e.qty }).eq("id", p.id);
      }
      const { error } = await sb.from("entries").delete().eq("id", e.id);
      if (error) return alert(error.message);
      loadAll();
    },
    async prodAdd() {
      const name = $("pName").value.trim();
      if (!name) return alert("পণ্যের নাম লিখুন");
      const { error } = await sb.from("products").insert({
        sector: cur, category: $("pCat")?.value.trim() || curCat || null, name, qty: Number($("pQty").value) || 0,
        buy_price: Number($("pBuy").value) || 0, sell_price: Number($("pSell").value) || 0
      });
      if (error) return alert(error.message);
      loadAll();
    },
    async prodIn(el) {
      const p = products.find(x => String(x.id) === el.dataset.id);
      if (!p) return;
      const n = Number(prompt(p.name + " — কত পিস যোগ হবে?"));
      if (!n || n <= 0) return;
      const { error } = await sb.from("products").update({ qty: p.qty + n }).eq("id", p.id);
      if (error) return alert(error.message);
      loadAll();
    },
    async prodDel(el) {
      if (!confirm("পণ্যটি স্টক থেকে মুছবেন?")) return;
      const { error } = await sb.from("products").delete().eq("id", el.dataset.id);
      if (error) return alert(error.message);
      loadAll();
    }
  };

  document.addEventListener("click", e => {
    const el = e.target.closest("button[data-act]");
    if (el && actions[el.dataset.act]) actions[el.dataset.act](el);
  });
  document.addEventListener("change", e => {
    const el = e.target.closest("select[data-act], input[data-act]");
    if (el && actions[el.dataset.act]) actions[el.dataset.act](el);
  });

  // ---------- শুরু ----------
  (async () => {
    const { data: { session } } = await sb.auth.getSession();
    if (session) showApp();
    else showLogin();
  })();
</script>
</body>
</html>
