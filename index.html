<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ইনভেন্টরি</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; padding: 12px; background: #f1f3f6; }
  .box { background: #fff; border-radius: 10px; padding: 16px; max-width: 900px; margin: 0 auto 14px; box-shadow: 0 1px 4px rgba(0,0,0,.1); }
  input { width: 100%; padding: 10px; margin: 5px 0; border: 1px solid #ccc; border-radius: 6px; font-size: 16px; box-sizing: border-box; }
  button { padding: 10px 14px; margin: 4px 4px 0 0; border: 0; border-radius: 6px; background: #1a73e8; color: #fff; font-size: 15px; cursor: pointer; }
  button.red { background: #d93025; }
  button.gray { background: #777; }
  table { width: 100%; border-collapse: collapse; font-size: 15px; }
  th, td { text-align: left; padding: 8px; border-bottom: 1px solid #eee; }
  .hidden { display: none; }
  .err { color: #d93025; }
</style>
</head>
<body>

<div id="loginBox" class="box">
  <h3>লগ ইন করুন</h3>
  <input id="email" type="email" placeholder="ইমেইল">
  <input id="password" type="password" placeholder="পাসওয়ার্ড">
  <button id="loginBtn">লগ ইন</button>
  <p id="loginMsg" class="err"></p>
</div>

<div id="appBox" class="hidden">
  <div class="box">
    <button id="logoutBtn" class="red">লগ আউট</button>
  </div>

  <div class="box">
    <h3 id="formTitle">নতুন আইটেম যোগ করুন</h3>
    <input id="name" placeholder="পণ্যের নাম">
    <input id="stock" type="number" placeholder="স্টক">
    <input id="price" type="number" placeholder="দাম">
    <input id="editId" type="hidden">
    <button id="saveBtn">সেভ করুন</button>
    <button id="cancelBtn" class="gray hidden">বাতিল</button>
  </div>

  <div class="box">
    <table>
      <thead><tr><th>নাম</th><th>স্টক</th><th>দাম</th><th></th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
</div>

<script type="module">
  import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

  const SUPABASE_URL = "https://fvxapnnbkhtvgwzthrsf.supabase.co";
  const SUPABASE_KEY = "sb_publishable_oj6orwGEGlo5bwHB4whaSg_xo6FzsaT";
  const sb = createClient(SUPABASE_URL, SUPABASE_KEY);

  const $ = id => document.getElementById(id);
  let items = [];

  function showLogin() {
    $("appBox").classList.add("hidden");
    $("loginBox").classList.remove("hidden");
  }
  function showApp() {
    $("loginBox").classList.add("hidden");
    $("appBox").classList.remove("hidden");
    loadItems();
  }

  $("loginBtn").onclick = async () => {
    $("loginMsg").textContent = "";
    const { error } = await sb.auth.signInWithPassword({
      email: $("email").value.trim(),
      password: $("password").value
    });
    if (error) $("loginMsg").textContent = "ইমেইল বা পাসওয়ার্ড ভুল হয়েছে";
    else showApp();
  };

  $("logoutBtn").onclick = async () => {
    await sb.auth.signOut();
    showLogin();
  };

  async function loadItems() {
    const { data, error } = await sb.from("Product").select("*").order("name");
    if (error) return alert("ডাটা আনা যায়নি: " + error.message);
    items = data;
    render();
  }

  function render() {
    const tbody = $("rows");
    tbody.innerHTML = "";
    for (const it of items) {
      const tr = document.createElement("tr");
      tr.innerHTML = "<td></td><td></td><td></td><td></td>";
      tr.children[0].textContent = it.name;
      tr.children[1].textContent = it.Stock;
      tr.children[2].textContent = it.Price;

      const editBtn = document.createElement("button");
      editBtn.textContent = "এডিট";
      editBtn.onclick = () => startEdit(it);

      const delBtn = document.createElement("button");
      delBtn.textContent = "মুছুন";
      delBtn.className = "red";
      delBtn.onclick = () => removeItem(it.id, it.name);

      tr.children[3].append(editBtn, delBtn);
      tbody.appendChild(tr);
    }
  }

  function startEdit(it) {
    $("editId").value = it.id;
    $("name").value = it.name;
    $("stock").value = it.Stock;
    $("price").value = it.Price;
    $("formTitle").textContent = "আইটেম এডিট করুন";
    $("cancelBtn").classList.remove("hidden");
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  function resetForm() {
    $("editId").value = "";
    $("name").value = "";
    $("stock").value = "";
    $("price").value = "";
    $("formTitle").textContent = "নতুন আইটেম যোগ করুন";
    $("cancelBtn").classList.add("hidden");
  }

  $("cancelBtn").onclick = resetForm;

  $("saveBtn").onclick = async () => {
    const name = $("name").value.trim();
    if (!name) return alert("পণ্যের নাম লিখুন");

    const row = {
      name,
      Stock: Number($("stock").value) || 0,
      Price: Number($("price").value) || 0
    };

    const id = $("editId").value;
    const res = id
      ? await sb.from("Product").update(row).eq("id", id)
      : await sb.from("Product").insert(row);

    if (res.error) return alert("সেভ হয়নি: " + res.error.message);
    resetForm();
    loadItems();
  };

  async function removeItem(id, name) {
    if (!confirm(`"${name}" মুছে ফেলতে চান?`)) return;
    const { error } = await sb.from("Product").delete().eq("id", id);
    if (error) alert("মোছা যায়নি: " + error.message);
    else loadItems();
  }

  (async () => {
    const { data: { session } } = await sb.auth.getSession();
    if (session) showApp();
    else showLogin();
  })();
</script>
</body>
</html>
